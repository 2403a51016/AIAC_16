<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <main class="registration">
        <h1 class="registration__title" id="registrationTitle">Conference Registration</h1>
        <form class="registration__form" id="regForm" novalidate aria-labelledby="registrationTitle">
            <div class="registration__field">
                <label for="name" class="registration__label">Full Name</label>
                <input type="text" id="name" name="name" class="registration__input" required aria-required="true" aria-label="Full Name">
                <span class="registration__error" id="nameError" aria-live="polite"></span>
            </div>
            <div class="registration__field">
                <label for="email" class="registration__label">Email</label>
                <input type="email" id="email" name="email" class="registration__input" required aria-required="true" aria-label="Email">
                <span class="registration__error" id="emailError" aria-live="polite"></span>
            </div>
            <div class="registration__field">
                <label for="phone" class="registration__label">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="registration__input" required aria-required="true" aria-label="Phone Number" pattern="[0-9]{10}">
                <span class="registration__error" id="phoneError" aria-live="polite"></span>
            </div>
            <div class="registration__field">
                <label for="session" class="registration__label">Select Session</label>
                <select id="session" name="session" class="registration__input" required aria-required="true" aria-label="Session Selection">
                    <option value="">-- Please choose a session --</option>
                    <option value="ai">AI & Machine Learning</option>
                    <option value="web">Web Development</option>
                    <option value="cloud">Cloud Computing</option>
                </select>
                <span class="registration__error" id="sessionError" aria-live="polite"></span>
            </div>
            <button type="submit" class="registration__submit">Register</button>
        </form>
        <div class="registration__success" id="successMessage" role="alert" style="display:none;">
            Registration successful! Thank you for registering.
        </div>
    </main>
    <script src="scripts/form.js"></script>
</body>
</html>
