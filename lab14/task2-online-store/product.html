<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store - Product Page</title>
    <link rel="stylesheet" href="styles/product.css">
</head>
<body>
    <main class="product">
        <div class="product__image-container">
            <img src="https://via.placeholder.com/350x250.png?text=Product+Image" alt="Product" class="product__image">
        </div>
        <div class="product__details">
            <h1 class="product__title">Wireless Headphones</h1>
            <p class="product__price">&#8377;2,499</p>
            <button class="product__add-to-cart">Add to Cart</button>
        </div>
    </main>
    <script>
        document.querySelector('.product__add-to-cart').addEventListener('click', function() {
            alert('Product added to cart!');
        });
    </script>
</body>
</html>
